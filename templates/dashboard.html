<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwoSpaces - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="theme-light min-h-screen font-sans transition-colors duration-300">

    <nav class="border-b border-opacity-10 px-6 py-4 flex items-center justify-between sticky top-0 backdrop-blur-md z-50">
        <div class="flex items-center gap-2 font-bold text-lg tracking-wide">
            <i data-lucide="book-heart"></i> TwoSpaces
        </div>
        <div class="flex items-center gap-4">
            <select id="themeSelector" onchange="changeTheme(this.value)" class="text-xs font-medium px-3 py-1.5 rounded-lg border bg-transparent focus:outline-none">
                <option value="theme-light">✨ Light Mode</option>
                <option value="theme-dark">🌙 Dark Mode</option>
                <option value="theme-pink">🌸 Pink Aesthetic</option>
                <option value="theme-cyber">⚡ Cyberpunk 2077</option>
                <option value="theme-scrapbook">🪵 Cute Scrapbook</option>
            </select>
            <div class="text-xs px-3 py-1.5 rounded-lg border border-opacity-20 font-mono select-all">
                Key: <span class="font-bold">{{ diary_code }}</span>
            </div>
            <a href="/logout" class="p-2 rounded-lg hover:bg-red-50 hover:text-red-600 transition" title="Log Out">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            <div class="card p-6 rounded-2xl shadow-sm border border-opacity-10">
                <div class="flex items-center justify-between mb-4">
                    <h2 id="calendarMonthYear" class="font-bold text-lg"></h2>
                    <div class="flex gap-1">
                        <button onclick="prevMonth()" class="p-1 rounded hover:bg-opacity-10 hover:bg-black"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <button onclick="nextMonth()" class="p-1 rounded hover:bg-opacity-10 hover:bg-black"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold opacity-60 mb-2">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                <div id="calendarDays" class="grid grid-cols-7 gap-1 text-center text-sm font-medium"></div>
            </div>

            <div class="card p-4 rounded-xl text-xs opacity-70">
                <p>💡 <b>Tip:</b> Click any calendar tile highlighted with a soft background border to review logs written on that specific date.</p>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-6">
            
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="calendar"></i> Focus Date: <span id="focusedDateLabel" class="underline decoration-indigo-500"></span>
                </h2>
            </div>

            <div id="editorBlock" class="card p-6 rounded-2xl shadow-sm space-y-4">
                <h3 class="font-bold text-sm tracking-wider uppercase opacity-80">Log standard update for this date:</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="entryTitle" placeholder="Catchy title..." class="md:col-span-2 px-4 py-2 rounded-xl bg-transparent border border-opacity-20 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <select id="entryMood" class="px-4 py-2 rounded-xl bg-transparent border border-opacity-20 focus:outline-none">
                        <option value="😊">😊 Happy</option>
                        <option value="😢">😢 Sad</option>
                        <option value="😍">😍 In Love</option>
                        <option value="🥰">🥰 Grateful</option>
                        <option value="😴">😴 Tired</option>
                    </select>
                </div>
                <textarea id="entryContent" rows="4" placeholder="Write down your thoughts, activities, or notes..." class="w-full p-4 rounded-xl bg-transparent border border-opacity-20 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                <div class="flex justify-end">
                    <button onclick="submitNewLog()" class="px-6 py-2 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition flex items-center gap-2">
                        <i data-lucide="check"></i> Save Log Entry
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-md tracking-wide">Historical Logs on this Day</h3>
                <div id="historicalEntriesContainer" class="space-y-4">
                    </div>
            </div>

        </div>
    </div>

    <script>
        let currentYear, currentMonth;
        let selectedDateStr = ""; // Stores 'YYYY-MM-DD'
        let globalDatabaseCache = [];

        // Global Architectural UI Engine Color Matrix Framework
        function changeTheme(themeName) {
            document.body.className = themeName;
            localStorage.setItem('diary-theme', themeName);
        }

        // Initialize Engine Systems
        document.addEventListener("DOMContentLoaded", async () => {
            const preservedTheme = localStorage.getItem('diary-theme') || 'theme-light';
            document.getElementById('themeSelector').value = preservedTheme;
            changeTheme(preservedTheme);

            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            
            // Format today's date placeholder default string context parameters
            selectedDateStr = formatDateKey(currentYear, currentMonth, now.getDate());

            await syncDataWithCloudDatabase();
            renderCalendarFramework();
            renderSelectedDayDataLogs();
            lucide.createIcons();
        });

        function formatDateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        async function syncDataWithCloudDatabase() {
            try {
                const response = await fetch('/api/entries');
                globalDatabaseCache = await response.json();
            } catch (err) {
                console.error("Critical fault syncing database records matrix: ", err);
            }
        }

        function renderCalendarFramework() {
            const daysContainer = document.getElementById("calendarDays");
            const labelMonthYear = document.getElementById("calendarMonthYear");
            daysContainer.innerHTML = "";

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            labelMonthYear.innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDaysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Render offset paddings
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                daysContainer.appendChild(emptyCell);
            }

            // Render structural numerical day interfaces
            for (let day = 1; day <= totalDaysInMonth; day++) {
                const dayStr = formatDateKey(currentYear, currentMonth, day);
                const dayCell = document.createElement("button");
                dayCell.innerText = day;
                dayCell.className = "p-2 rounded-lg text-center hover:bg-indigo-500 hover:text-white transition duration-150 flex flex-col items-center justify-between min-h-[40px] border border-transparent";
                
                // Track selected state visually
                if (dayStr === selectedDateStr) {
                    dayCell.classList.add("bg-indigo-600", "text-white");
                } else {
                    dayCell.classList.add("bg-slate-100", "text-slate-800");
                }

                // Check if items are saved on this dynamic date element block
                const datesWithContent = globalDatabaseCache.filter(e => e.date_str === dayStr);
                if (datesWithContent.length > 0 && dayStr !== selectedDateStr) {
                    dayCell.classList.add("border-indigo-500", "font-bold");
                }

                dayCell.onclick = () => {
                    selectedDateStr = dayStr;
                    renderCalendarFramework();
                    renderSelectedDayDataLogs();
                };

                daysContainer.appendChild(dayCell);
            }
        }

        function renderSelectedDayDataLogs() {
            document.getElementById("focusedDateLabel").innerText = selectedDateStr;
            const container = document.getElementById("historicalEntriesContainer");
            container.innerHTML = "";

            const relativeLogs = globalDatabaseCache.filter(e => e.date_str === selectedDateStr);

            if(relativeLogs.length === 0) {
                container.innerHTML = `
                    <div class="p-8 border-2 border-dashed border-opacity-20 rounded-2xl text-center opacity-60 text-sm">
                        No memories recorded for this specific day yet. Write one above!
                    </div>`;
                return;
            }

            relativeLogs.forEach(log => {
                const block = document.createElement("div");
                block.className = "card p-5 rounded-xl border border-opacity-10 shadow-sm space-y-2";
                block.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">${log.mood}</span>
                            <h4 class="font-bold text-lg">${log.title}</h4>
                        </div>
                        <span class="text-xs font-semibold px-2 py-1 rounded bg-black bg-opacity-5">Author: ${log.author}</span>
                    </div>
                    <p class="text-sm opacity-90 leading-relaxed whitespace-pre-wrap">${log.content}</p>
                `;
                container.appendChild(block);
            });
        }

        async function submitNewLog() {
            const title = document.getElementById("entryTitle").value.trim();
            const content = document.getElementById("entryContent").value.trim();
            const mood = document.getElementById("entryMood").value;

            if(!title || !content) {
                alert("Please complete both Title and Content components before cataloging entry.");
                return;
            }

            const packagePayload = { title, content, mood, date_str: selectedDateStr };

            const response = await fetch('/api/entries', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(packagePayload)
            });

            if (response.ok) {
                document.getElementById("entryTitle").value = "";
                document.getElementById("entryContent").value = "";
                await syncDataWithCloudDatabase();
                renderCalendarFramework();
                renderSelectedDayDataLogs();
            }
        }

        function prevMonth() { currentMonth--; if(currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendarFramework(); }
        function nextMonth() { currentMonth++; if(currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendarFramework(); }
    </script>
</body>
</html>
