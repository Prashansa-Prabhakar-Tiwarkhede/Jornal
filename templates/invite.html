<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Shared Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full border border-slate-100">
        <div class="flex flex-col items-center text-center mb-8">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mb-4">
                <i data-lucide="users" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Initialize Your Space</h1>
            <p class="text-slate-500 text-sm mt-1">Hello, {{ user.name }}. Create a new workspace or join an existing shared diary.</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="bg-amber-50 text-amber-700 p-3 rounded-lg text-sm mb-4 text-center">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <div class="space-y-6">
            <form action="/manage-diary" method="POST">
                <input type="hidden" name="action" value="create">
                <button type="submit" class="w-full group text-left p-4 rounded-xl border border-dashed border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/30 transition flex items-center justify-between">
                    <div>
                        <h3 class="font-semibold text-slate-800 group-hover:text-indigo-600">Generate a New Diary</h3>
                        <p class="text-xs text-slate-500">Creates a fresh key you can share with your partner.</p>
                    </div>
                    <i data-lucide="arrow-right" class="w-5 h-5 text-slate-400 group-hover:text-indigo-500"></i>
                </button>
            </form>

            <div class="relative flex py-2 items-center text-xs text-slate-400 uppercase font-semibold">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4">Or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <form action="/manage-diary" method="POST" class="space-y-3">
                <input type="hidden" name="action" value="join">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Enter Invite Code</label>
                    <input type="text" name="diary_code" required placeholder="E.g., A7B3C9E2" class="w-full text-center tracking-widest font-mono px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase transition">
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg transition shadow-sm">Connect To Space</button>
            </form>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
